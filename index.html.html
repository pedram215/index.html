<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه سوال دارم ازت 💌</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Vazirmatn", "Tahoma", sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ffc1cc 40%, #ff9eb5 100%);
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    padding: 30px 0;
  }

  .hearts-bg span {
    position: fixed;
    top: -10%;
    font-size: 24px;
    color: rgba(255,255,255,0.6);
    animation: fall linear infinite;
    user-select: none;
    pointer-events: none;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 50px 35px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(255, 105, 135, 0.35);
    max-width: 420px;
    width: 90%;
    z-index: 2;
    animation: pop-in 0.6s ease;
  }

  @keyframes pop-in {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .flower {
    font-size: 42px;
    margin-bottom: 10px;
    animation: sway 3s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  h1 {
    color: #d63665;
    font-size: 28px;
    margin: 10px 0 8px;
    line-height: 1.6;
  }

  #question {
    font-size: 24px;
    font-weight: bold;
    color: #b3184e;
    margin: 20px 0 35px;
    transition: all 0.3s ease;
  }

  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    position: relative;
    min-height: 90px;
  }

  button {
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: all 0.25s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 69, 105, 0.5);
  }

  #yesBtn:hover {
    transform: scale(1.08);
  }

  #noBtn {
    background: #f0f0f0;
    color: #999;
    position: relative;
  }

  .result {
    margin-top: 25px;
    font-size: 20px;
    color: #b3184e;
    font-weight: bold;
    min-height: 30px;
    animation: pop-in 0.4s ease;
  }

  .picker-title {
    color: #d63665;
    font-size: 19px;
    margin: 18px 0 12px;
  }

  .swipe-picker .day-chip,
  .swipe-picker .time-chip {
    flex: 0 0 auto;
    font-family: inherit;
  }

  .swipe-picker button {
    -webkit-tap-highlight-color: transparent;
  }
.swipe-picker::-webkit-scrollbar {
    height: 7px;
  }

  .scroll-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 4px 14px;
    cursor: grab;
    scroll-snap-type: x proximity;
    user-select: none;
    scrollbar-width: none;
  }
  .scroll-row::-webkit-scrollbar { display: none; }
.day-chip {
    flex: 0 0 auto;
    background: #fff0f4;
    border: 2px solid #ffd3de;
    border-radius: 16px;
    padding: 10px 14px;
    text-align: center;
    scroll-snap-align: center;
    transition: all 0.2s ease;
    min-width: 62px;
  }
  .day-chip .wd { font-size: 12px; color: #d6688a; }
  .day-chip .num { font-size: 20px; font-weight: bold; color: #b3184e; margin: 2px 0; }
  .day-chip .mo { font-size: 11px; color: #d6688a; }

  .day-chip.selected {
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    border-color: #ff4569;
    transform: scale(1.08);
  }
  .day-chip.selected .wd,
  .day-chip.selected .num,
  .day-chip.selected .mo { color: white; }

  .time-chip {
    flex: 0 0 auto;
    background: #fff0f4;
    border: 2px solid #ffd3de;
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: bold;
    color: #b3184e;
    scroll-snap-align: center;
    transition: all 0.2s ease;
  }
  .time-chip.selected {
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    border-color: #ff4569;
    color: white;
    transform: scale(1.08);
  }

  .time-chip.disabled {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  #confirmBtn {
    margin-top: 10px;
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 69, 105, 0.5);
    font-size: 17px;
    padding: 12px 30px;
    opacity: 0.4;
    pointer-events: none;
  }
  #confirmBtn.ready {
    opacity: 1;
    pointer-events: auto;
  }
  #confirmBtn.ready:hover { transform: scale(1.05); }

  #confirmPlaceBtn {
    margin-top: 10px;
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 69, 105, 0.5);
    font-size: 17px;
    padding: 12px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: all 0.25s ease;
  }
  #confirmPlaceBtn:hover { transform: scale(1.05); }

  .place-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff0f4;
    border: 2px solid #ffd3de;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    text-align: right;
    transition: all 0.2s ease;
  }
  .place-card .emoji { font-size: 30px; flex-shrink: 0; }
  .place-card .info { flex: 1; }
  .place-card .name { font-weight: bold; color: #b3184e; font-size: 16px; }
  .place-card .addr { font-size: 12px; color: #d6688a; margin-top: 3px; }

  .place-card.selected {
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    border-color: #ff4569;
  }
  .place-card.selected .name,
  .place-card.selected .addr { color: white; }
.custom-place-box {
    margin: 16px 0 12px;
    text-align: right;
  }

  .custom-place-input {
    width: 100%;
    border: 2px solid #ffd3de;
    border-radius: 16px;
    padding: 13px 15px;
    font-family: inherit;
    font-size: 15px;
    color: #b3184e;
    background: #fffafc;
    outline: none;
    transition: all 0.2s ease;
  }

  .custom-place-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 3px rgba(255,111,145,0.12);
  }

  .custom-place-message {
    min-height: 22px;
    margin-top: 7px;
    font-size: 13px;
    color: #d63665;
    font-weight: bold;
  }

  .extra-section {
    margin-top: 18px;
    padding: 15px;
    border-radius: 20px;
    background: rgba(255, 240, 244, 0.82);
    border: 2px solid #ffd3de;
  }
.step-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
  }

  .step-btn {
    min-width: 120px;
    border: 0;
    border-radius: 999px;
    padding: 11px 20px;
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }

  .step-btn.back {
    background: #fff0f4;
    color: #b3184e;
    border: 2px solid #ffd3de;
  }

  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 8px 0 18px;
  }

  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffd3de;
    transition: .25s ease;
  }

  .step-dot.active {
    width: 22px;
    border-radius: 999px;
    background: #ff6f91;
  }

  @keyframes step-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feature-section {
    margin-top: 18px;
    padding: 18px 15px;
    border-radius: 22px;
    background: rgba(255,255,255,0.86);
    border: 2px solid #ffd3de;
    box-shadow: 0 8px 22px rgba(255,105,135,0.10);
  }

  .feature-title {
    margin: 0 0 10px;
    color: #d63665;
    font-size: 18px;
    font-weight: bold;
  }

  .feature-divider {
    height: 1px;
    margin: 16px 0;
    background: #ffdbe4;
  }

  .section-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
    margin: 10px 0 16px;
  }

  .section-nav span {
    padding: 6px 10px;
    border-radius: 999px;
    background: #fff0f4;
    color: #b3184e;
    font-size: 12px;
  }

  @media (max-width: 520px) {
    .feature-section {
      padding: 15px 12px;
      border-radius: 18px;
    }
    .feature-title { font-size: 16px; }
    .section-nav span { font-size: 11px; }
  }

  .personal-message {
    color: #b3184e;
    line-height: 2;
    font-size: 16px;
  }

  .question-box {
    margin-top: 14px;
    text-align: right;
  }

  .question-box label {
    display: block;
    color: #d63665;
    font-weight: bold;
    margin-bottom: 7px;
  }

  .question-box input,
  .question-box textarea {
    width: 100%;
    border: 2px solid #ffd3de;
    border-radius: 14px;
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14px;
    color: #b3184e;
    background: #fff;
    outline: none;
    resize: vertical;
  }

  .choice-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .choice-btn {
    background: #fff;
    color: #b3184e;
    border: 2px solid #ffd3de;
    border-radius: 14px;
    padding: 9px 12px;
    font-family: inherit;
    font-weight: bold;
  }

  .choice-btn.selected {
    background: linear-gradient(135deg, #ff6f91, #ff4569);
    color: #fff;
    border-color: #ff4569;
  }

  .countdown {
    margin-top: 12px;
    color: #d63665;
    font-weight: bold;
    line-height: 1.9;
    font-size: 16px;
  }

  .surprise-btn {
    margin-top: 12px;
    padding: 11px 20px;
    background: linear-gradient(135deg, #ffb347, #ff6f91);
    color: #fff;
    font-size: 15px;
  }

  .surprise-content {
    display: none;
    margin-top: 12px;
    color: #b3184e;
    line-height: 2;
    animation: pop-in 0.45s ease;
  }

  .surprise-content.show { display: block; }

  .final-celebration {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    overflow: hidden;
  }

  .celebration-item {
    position: absolute;
    bottom: -40px;
    animation: celebrate 3.4s ease-out forwards;
  }

  @keyframes celebrate {
    0% { transform: translateY(0) rotate(0deg) scale(.7); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translateY(-115vh) rotate(360deg) scale(1.35); opacity: 0; }
  }

  /* Better mobile layout */
  @media (max-width: 520px) {
    body {
      padding: 14px 0;
      align-items: flex-start;
    }

    .card {
      width: calc(100% - 20px);
      max-width: 430px;
      padding: 30px 16px;
      border-radius: 22px;
    }

    h1 { font-size: 23px; }
    #question { font-size: 21px; margin-bottom: 24px; }
    .buttons { gap: 10px; min-height: 76px; }
    .place-card { padding: 12px; }
    .place-card .emoji { font-size: 26px; }
  
  .swipe-picker {
    display: flex;
    flex-wrap: nowrap;
    gap: 9px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 5px 14px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    touch-action: pan-x;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
  }

  .swipe-picker > .day-chip,
  .swipe-picker > .time-chip {
    flex: 0 0 auto;
    scroll-snap-align: center;
    -webkit-tap-highlight-color: transparent;
  }

  .swipe-picker::-webkit-scrollbar {
    height: 7px;
  }

  .day-chip { min-width: 58px; padding: 9px 11px; }
    .time-chip { padding: 9px 12px; }
    #confirmBtn, #confirmPlaceBtn { width: 100%; }
  }

</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="card" id="app">
  <div class="flower">🌷🌹🌷</div>
  <div class="step-indicator" id="stepIndicator">
    <span class="step-dot active"></span>
    <span class="step-dot"></span>
    <span class="step-dot"></span>
    <span class="step-dot"></span>
  </div>
  <div id="stepContent"></div>
</div>

<script>
const app = document.getElementById('app');
const stepContent = document.getElementById('stepContent');
const dots = [...document.querySelectorAll('.step-dot')];
let step = 0;
let dateIso = null, dateLabel = null, selectedTime = null, selectedPlace = null;
let mood = '', personalNote = '';
let countdownInterval = null;

function dotsUpdate(){ dots.forEach((d,i)=>d.classList.toggle('active',i===step)); }
function render(content){ stepContent.innerHTML=content; dotsUpdate(); window.scrollTo({top:0,behavior:'smooth'}); }
function nav(back, next, nextId=''){ return `<div class="step-actions">${back?'<button class="step-btn back" id="backBtn">قبلی</button>':''}${next?`<button class="step-btn" id="nextBtn" ${nextId?'disabled':''}>${next}</button>`:''}</div>`; }

function step1(){
  document.getElementById('stepIndicator').style.display='flex';
  step=0;
  render(`
    <div style="font-size:52px">💌</div>
    <h1 style="color:#d63665">یه پیام کوچیک برای تو...</h1>
    <div class="feature-section">
      <div class="feature-title">💖 پیام شخصی</div>
      <div class="personal-message">یه قرار قشنگ در انتظارمونه...<br>امیدوارم یه خاطره خیلی خوب با هم بسازیم 🌷</div>
    </div>
    <div class="step-actions"><button class="step-btn" id="startBtn">بریم ادامه 💕</button></div>`);
  document.getElementById('startBtn').onclick=step2;
}

function step2(){
  step=1;

  const startDate=new Date();
  startDate.setHours(0,0,0,0);
  const daysUntilNextSaturday=((6-startDate.getDay()+7)%7)||7;
  startDate.setDate(startDate.getDate()+daysUntilNextSaturday);

  const days=[];
  for(let i=0;i<30;i++){
    const d=new Date(startDate);
    d.setDate(startDate.getDate()+i);
    days.push(d);
  }

  const dateChips=days.map(d=>{
    const wd=new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d);
    const num=new Intl.DateTimeFormat('fa-IR',{day:'numeric'}).format(d);
    const mo=new Intl.DateTimeFormat('fa-IR',{month:'short'}).format(d);
    const selected=dateIso && new Date(dateIso).toDateString()===d.toDateString()?' selected':'';
    return `<button type="button" class="day-chip${selected}" data-iso="${d.toISOString()}" data-label="${wd} ${num} ${mo}">
      <div class="wd">${wd}</div><div class="num">${num}</div><div class="mo">${mo}</div>
    </button>`;
  }).join('');

  const times=[];
  for(let h=9;h<=21;h++){
    times.push(String(h).padStart(2,'0')+':00');
    if(h<21) times.push(String(h).padStart(2,'0')+':30');
  }

  const timeChips=times.map(t=>{
    const selected=selectedTime===t?' selected':'';
    return `<button type="button" class="time-chip${selected}" data-time="${t}">${t}</button>`;
  }).join('');

  render(`
    <div style="font-size:48px">📅⏰</div>
    <h1 style="color:#d63665">روز و ساعت</h1>
    <div style="font-size:16px;color:#b3184e">روز و ساعت رو با هم انتخاب کن</div>

    <div class="picker-title">📅 روز</div>
    <div class="scroll-row swipe-picker" id="dateRow">${dateChips}</div>

    <div class="picker-title">⏰ ساعت</div>
    <div class="scroll-row swipe-picker" id="timeRow">${timeChips}</div>

    <div id="pickResult" style="min-height:24px;color:#b3184e;font-weight:bold;margin:10px 0">
      لطفاً روز و ساعت را انتخاب کن
    </div>
    ${nav(false,'ادامه 📍')}
  `);

  const dateRow=document.getElementById('dateRow');
  const timeRow=document.getElementById('timeRow');
  const result=document.getElementById('pickResult');
  const next=document.getElementById('nextBtn');

  function update(){
    const ok=!!(dateLabel&&selectedTime);
    result.textContent=ok ? `${dateLabel} — ساعت ${selectedTime}` : 'لطفاً روز و ساعت را انتخاب کن';
    next.disabled=!ok;
  }

  function selectDate(chip){
    dateRow.querySelectorAll('.day-chip').forEach(x=>x.classList.remove('selected'));
    chip.classList.add('selected');
    dateIso=chip.dataset.iso;
    dateLabel=chip.dataset.label;
    update();
  }

  function selectTime(chip){
    timeRow.querySelectorAll('.time-chip').forEach(x=>x.classList.remove('selected'));
    chip.classList.add('selected');
    selectedTime=chip.dataset.time;
    update();
  }

  dateRow.querySelectorAll('.day-chip').forEach(chip=>{
    chip.addEventListener('click',()=>selectDate(chip));
  });
  timeRow.querySelectorAll('.time-chip').forEach(chip=>{
    chip.addEventListener('click',()=>selectTime(chip));
  });

  // Do not implement custom pointer-dragging. Native overflow scrolling is
  // more reliable on phones and touchpads, and clicks remain independent.
  [dateRow,timeRow].forEach(row=>{
    row.style.overflowX='auto';
    row.style.overflowY='hidden';
    row.style.touchAction='pan-x';
    row.style.webkitOverflowScrolling='touch';
    row.style.scrollSnapType='x proximity';
  });

  update();

  const selectedDay=dateRow.querySelector('.day-chip.selected');
  const selectedClock=timeRow.querySelector('.time-chip.selected');
  if(selectedDay) selectedDay.scrollIntoView({inline:'center',block:'nearest'});
  if(selectedClock) selectedClock.scrollIntoView({inline:'center',block:'nearest'});

  next.onclick=()=>{
    if(dateLabel&&selectedTime) step3();
  };
}

function step3(){
  step=2;
  const places=[['☕','کافه'],['🎬','سینما'],['🎮','گیم‌نت'],['🏛️','میدان نقش جهان'],['🌉','سی و سه پل']];
  const cards=places.map((p,i)=>`<div class="place-card" data-name="${p[1]}"><div class="emoji">${p[0]}</div><div class="info"><div class="name">${p[1]}</div></div></div>`).join('');
  render(`<div style="font-size:48px">📍</div><h1 style="color:#d63665">انتخاب مکان</h1><div style="font-size:16px;color:#b3184e;margin-bottom:14px">کجا دوست داری بریم؟</div>${cards}<div class="custom-place-box"><input id="customPlaceInput" class="custom-place-input" maxlength="80" placeholder="یا خودت بنویس کجا بریم... ✨" autocomplete="off"><div id="customPlaceMessage" class="custom-place-message"></div></div>${nav(false,'ادامه 📝')}`);
  const input=document.getElementById('customPlaceInput'), msg=document.getElementById('customPlaceMessage'); let chosen=null;
  const bad=['نمیام','نمی آیم','نمیایم','هیچ جا','هیچ‌جا','نمیخوام','نمی خوام','نمی‌خوام','نمی‌دونم','نمیدونم','نه','نمی‌رم','نمیرم','نمی روم','نمی‌روم'];
  const norm=x=>x.trim().toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c]/g,' ').replace(/\s+/g,' ');
  const negative=x=>bad.some(b=>norm(x).includes(norm(b)));
  const next=document.getElementById('nextBtn'); next.disabled=true;
  document.querySelectorAll('.place-card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.place-card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');chosen=c.dataset.name;input.value='';msg.textContent='';next.disabled=false;});
  input.oninput=()=>{document.querySelectorAll('.place-card').forEach(x=>x.classList.remove('selected'));const v=input.value.trim();if(!v){chosen=null;msg.textContent='';next.disabled=true;return}if(negative(v)){chosen=null;msg.textContent='یه جای خوب پیشنهاد بده 😊';next.disabled=true;return}chosen=v;msg.textContent='';next.disabled=false;};
  next.onclick=()=>{selectedPlace=chosen;step4();};
}

function step4(){
  step=3;
  render(`<div style="font-size:48px">📝💖</div><h1 style="color:#d63665">یه انتخاب کوچیک دیگه</h1><div class="feature-section"><div class="feature-title">چه حال‌وهوایی دوست داری؟</div><div class="choice-row" id="moodChoices"><button type="button" class="choice-btn">آروم و دنج ☕</button><button type="button" class="choice-btn">هیجان‌انگیز 🎮</button><button type="button" class="choice-btn">قدم‌زدن 🌷</button></div><div class="question-box"><label for="personalNote">اگه دوست داشتی یه پیام کوتاه بذار:</label><textarea id="personalNote" rows="3" maxlength="120" placeholder="مثلاً یه جای دنج بریم..."></textarea></div></div>${nav(false,'ثبت نهایی 💌')}`);
  document.querySelectorAll('#moodChoices .choice-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#moodChoices .choice-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mood=b.textContent;});
  document.getElementById('personalNote').oninput=e=>personalNote=e.target.value.trim();
  document.getElementById('nextBtn').onclick=finalScreen;
}

function finalScreen(){
  step=3; dotsUpdate();
  document.getElementById('stepIndicator').style.display='none';
  render(`<div style="font-size:60px">💖✨</div><h1 style="color:#d63665">قرارمون ثبت شد!</h1><div style="font-size:19px;color:#b3184e;line-height:2">${dateLabel}<br>ساعت ${selectedTime}<br>${selectedPlace}</div>${mood?`<div style="margin-top:8px;color:#d6688a">حال‌وهوای انتخابی: ${mood}</div>`:''}${personalNote?`<div style="margin-top:5px;color:#d6688a">پیامت: ${personalNote}</div>`:''}<div class="feature-section"><div class="feature-title">⏳ شمارش معکوس تا قرار</div><div class="countdown" id="countdown"></div></div><div class="feature-section"><div class="feature-title">🎁 سورپرایز</div><div style="color:#b3184e;line-height:2">🤫 سورپرایز واقعی رو موقع دیت می‌فهمی! تا اون روز هیچ چیزی لو نمی‌ره 💖</div></div><div style="margin-top:16px;color:#d6688a">منتظرمون اون روز برسه 🌷</div>`);
  startCountdown(); startCelebration();
}

function startCountdown(){const el=document.getElementById('countdown');if(!el)return;const target=new Date(dateIso);const [h,m]=selectedTime.split(':').map(Number);target.setHours(h,m,0,0);function u(){const d=target-Date.now();if(d<=0){el.textContent='💖 وقت قرارمون رسیده!';clearInterval(countdownInterval);return}const days=Math.floor(d/86400000),hours=Math.floor(d%86400000/3600000),mins=Math.floor(d%3600000/60000),secs=Math.floor(d%60000/1000);el.textContent=`${days} روز، ${hours} ساعت، ${mins} دقیقه، ${secs} ثانیه`;};u();clearInterval(countdownInterval);countdownInterval=setInterval(u,1000)}
function startCelebration(){const layer=document.createElement('div');layer.className='final-celebration';document.body.appendChild(layer);const s=['💖','💕','✨','🌸','🎉','💗'];for(let i=0;i<42;i++){const x=document.createElement('span');x.className='celebration-item';x.textContent=s[Math.floor(Math.random()*s.length)];x.style.left=Math.random()*100+'vw';x.style.animationDelay=Math.random()*1.1+'s';x.style.fontSize=16+Math.random()*22+'px';layer.appendChild(x)}setTimeout(()=>layer.remove(),4700)}

// Original first-question behavior
function initial(){step=0;document.getElementById('stepIndicator').style.display='flex';render(`<div id="question">میای بریم دیت؟ 💕</div><div class="buttons"><button id="yesBtn">اره 😍</button><button id="noBtn">نه</button></div><div class="result" id="result"></div>`);let ys=18,ns=18,yp=16,np=16;const y=document.getElementById('yesBtn'),n=document.getElementById('noBtn'),r=document.getElementById('result');function sizes(){y.style.fontSize=ys+'px';y.style.padding=yp+'px '+yp*2+'px';n.style.fontSize=ns+'px';n.style.padding=np+'px '+np*2+'px'}sizes();n.onclick=()=>{if(ns>8){ns-=2;np=Math.max(np-2,3)}if(ys<34){ys+=3;yp+=3}sizes();r.textContent=['مطمئنی؟ 🥺','یه بار دیگه فکر کن...','نه رو بردار بذار اره 😅','داره ناپدید میشه ها!','فقط اره مونده دیگه 😏'][Math.min(Math.floor((18-ns)/2),4)]};y.onclick=()=>{step1()}}
initial();

// Soft original background melody: starts on first user interaction, no music button.
let audioCtx=null,musicTimer=null,musicStarted=false,musicStep=0;
const melody=[[261.63,329.63,392],[293.66,349.23,440],[261.63,329.63,392],[246.94,329.63,369.99],[261.63,329.63,392],[293.66,349.23,440],[329.63,392,493.88],[293.66,349.23,440]];
function playChord(notes){if(!audioCtx||audioCtx.state!=='running')return;const now=audioCtx.currentTime;notes.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i===0?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(i===0?.055:.025,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+1.9);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+2)})}
async function startMusic(){if(musicStarted)return;musicStarted=true;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();playChord(melody[musicStep++%melody.length]);musicTimer=setInterval(()=>playChord(melody[musicStep++%melody.length]),2000)}catch(e){musicStarted=false}}
['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,startMusic,{once:true,passive:true}));
const hearts=document.getElementById('heartsBg');const hs=['💗','💕','💖','🌸','💓'];for(let i=0;i<20;i++){const x=document.createElement('span');x.textContent=hs[Math.floor(Math.random()*hs.length)];x.style.left=Math.random()*100+'vw';x.style.animationDuration=6+Math.random()*6+'s';x.style.animationDelay=Math.random()*5+'s';x.style.fontSize=16+Math.random()*18+'px';hearts.appendChild(x)}
</script>
